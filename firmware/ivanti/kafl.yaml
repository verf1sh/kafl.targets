# kAFL config — Ivanti Connect Secure pre-auth fuzz
qemu_path: $QEMU_ROOT/x86_64-softmmu/qemu-system-x86_64
ptdump_path: $LIBXDC_ROOT/build/ptdump_static

qemu_image: /home/verf1sh/fuzzing/CVE-2025-22457/Ivanti.qcow2
qemu_memory: 4096
seed_dir: /home/verf1sh/fuzzing/kAFL/kafl/examples/firmware/ivanti/seeds

qemu_base: -enable-kvm -machine kAFL64-v1 -cpu kAFL64-Hypervisor,+vmx -no-reboot -display none
qemu_serial: -serial telnet:127.0.0.1:4444,server,nowait
qemu_extra: -monitor tcp:127.0.0.1:55555,server,nowait -netdev tap,id=net0,ifname=tap0,script=no,downscript=no -device e1000,netdev=net0

# Dummy fallback window. The guest agent submits the real web/libdsagentd.so
# text ranges after reading /proc/<webpid>/maps. Keeping ip0 non-overlapping
# avoids libxdc range assertions when ASLR places web inside a broad fallback.
ip0: 0x1000-0x2000

afl_dumb_mode: true
kickstart: 0
radamsa: false

custom_mutator: strategy_mutator
strategy_config: /home/verf1sh/fuzzing/kAFL/kafl/examples/firmware/ivanti/strategy.yaml
