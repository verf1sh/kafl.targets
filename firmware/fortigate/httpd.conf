cat /usr/local/apache2/conf/httpd.conf 
Define SSL_CERT_FILE "/tmp/admin_server.crt"
Define SSL_CERT_KEY_FILE "/tmp/admin_server.key"

StartServers 1

Define HTTPD_DYNAMIC_CONF /tmp/apache2/conf

IncludeOptional ${HTTPD_DYNAMIC_CONF}/admin-global.conf

Define HTTP_PORT 9980
Define HTTP_SOCK /tmp/httpsd.sock
Define HTTP_LOCAL /tmp/httpsd.local

#
# This is the main Apache HTTP server configuration file.  It contains the
# configuration directives that give the server its instructions.
# See <URL:http://httpd.apache.org/docs/2.4/> for detailed information.
# In particular, see
# <URL:http://httpd.apache.org/docs/2.4/mod/directives.html>
# for a discussion of each configuration directive.
#
# Do NOT simply read the instructions in here without understanding
# what they do.  They're here only as hints or reminders.  If you are unsure
# consult the online docs. You have been warned.
#
# Configuration and logfile names: If the filenames you specify for many
# of the server's control files begin with "/" (or "drive:/" for Win32), the
# server will use that explicit path.  If the filenames do *not* begin
# with "/", the value of ServerRoot is prepended -- so "logs/access_log"
# with ServerRoot set to "/usr/local/apache2" will be interpreted by the
# server as "/usr/local/apache2/logs/access_log", whereas "/logs/access_log"
# will be interpreted as '/logs/access_log'.

PidFile /var/run/httpd.pid

#
# ServerRoot: The top of the directory tree under which the server's
# configuration, error, and log files are kept.
#
# Do not add a slash at the end of the directory path.  If you point
# ServerRoot at a non-local disk, be sure to specify a local disk on the
# Mutex directive, if file-based mutexes are used.  If you wish to share the
# same ServerRoot for multiple httpd daemons, you will need to change at
# least PidFile.
#
ServerRoot "/usr/local/apache2"

#
# Mutex: Allows you to set the mutex mechanism and mutex file directory
# for individual mutexes, or change the global defaults
#
# Uncomment and change the directory if mutexes are file-based and the default
# mutex file directory is not on a local disk or is not appropriate for some
# other reason.
#
# Mutex default:logs

#
# Listen: Allows you to bind Apache to specific IP addresses and/or
# ports, instead of the default. See also the <VirtualHost>
# directive.
#
# Change this to Listen on specific IP addresses as shown below to
# prevent Apache from glomming onto all bound IP addresses.
#
# Listen 80
Listen 127.0.0.1:${HTTP_PORT}
Listen ${HTTP_SOCK}
Listen ${HTTP_LOCAL}

#
# Dynamic Shared Object (DSO) Support
#
# To be able to use the functionality of a module which was built as a DSO you
# have to place corresponding `LoadModule' lines at this location so the
# directives contained in it are actually available _before_ they are used.
# Statically compiled modules (those listed by `httpd -l') do not need
# to be loaded here.
#
# Example:
# LoadModule foo_module modules/mod_foo.so
#

<IfModule unixd_module>
#
# If you wish httpd to run as a different user or group, you must run
# httpd as root initially and it will switch.
#
# User/Group: The name (or #number) of the user/group to run httpd as.
# It is usually good practice to create a dedicated user and group for
# running httpd, as with most system services.
#
User daemon
Group daemon

</IfModule>

# 'Main' server configuration
#
# The directives in this section set up the values used by the 'main'
# server, which responds to any requests that aren't handled by a
# <VirtualHost> definition.  These values also provide defaults for
# any <VirtualHost> containers you may define later in the file.
#
# All of these directives may appear inside <VirtualHost> containers,
# in which case these default settings will be overridden for the
# virtual host being defined.
#

#
# ServerAdmin: Your address, where problems with the server should be
# e-mailed.  This address appears on some server-generated pages, such
# as error documents.  e.g. admin@your-domain.com
#
ServerAdmin you@example.com

#
# ServerName gives the name and port that the server uses to identify itself.
# This can often be determined automatically, but we recommend you specify
# it explicitly to prevent problems during startup.
#
# If your host doesn't have a registered DNS name, enter its IP address here.
#
<IfDefine ADMIN_HOST>
ServerName ${ADMIN_HOST}
</IfDefine>

#
# Deny access to the entirety of your server's filesystem. You must
# explicitly permit access to web content directories in other
# <Directory> blocks below.
#
<Directory />
    AllowOverride none
    #Require all denied
</Directory>

#
# Note that from this point forward you must specifically allow
# particular features to be enabled - so if something's not working as
# you might expect, make sure that you have specifically enabled it
# below.
#

<VirtualHost 127.0.0.1:${HTTP_PORT} ${HTTP_SOCK} ${HTTP_LOCAL}>
# Allow REST API request contains slashes(/) (as mkey) to pass through
AllowEncodedSlashes NoDecode

<Location "/api/v2/cmdb">
    SetHandler api_cmdb_v2-handler
</Location>
<Location "/api/v2/monitor">
    SetHandler api_monitor_v2-handler
</Location>
<Location "/api/v2/log">
    SetHandler api_log-handler
</Location>
<Location "/api/v2/authentication">
    SetHandler api_authentication-handler
</Location>
<Location "/login">
    SetHandler login-handler
</Location>
<Location "/logout">
    SetHandler logout-handler
</Location>
<Location "/logincheck">
    SetHandler logincheck-handler
</Location>
<Location /loginpwd_change>
    SetHandler loginpwd_change-handler
</Location>
<Location /logindisable>
    SetHandler logindisable-handler
</Location>
<Location /logindisclaimer>
    SetHandler logindisclaimer-handler
</Location>
<Location /restricted-account>
    SetHandler restricted-account-handler
</Location>
<Location /saml-idp>
    SetHandler saml-idp-handler
</Location>
<Location /saml-idp/login-check>
    SetHandler saml-idp-login-check-handler
</Location>
<Location /saml-idp/login-process>
    SetHandler saml-idp-login-process-handler
</Location>
<Location /saml-idp/logout-process>
    SetHandler saml-idp-logout-process-handler
</Location>
<Location /saml>
    SetHandler saml-sp-handler
</Location>
<Location /saml/login>
    SetHandler saml-sp-login-handler
</Location>
<Location /saml/login-forticloud>
    SetHandler saml-sp-forticloud-login-handler
</Location>
<Location /saml/logout>
    SetHandler saml-sp-logout-handler
</Location>
<Location /saml/logout-process>
    SetHandler saml-sp-logout-process-handler
</Location>
<Location /saml/logout-process-forticloud>
    SetHandler saml-sp-logout-process-forticloud-handler
</Location>
<Location /admin_session_limit_reached>
    SetHandler admin-session-limit-handler
</Location>
<Location /check_pwd_policy>
    SetHandler check_pwd_policy-handler
</Location>
<Location /error>
    SetHandler error-handler
</Location>
<Location /csf>
    SetHandler api_csf-handler
</Location>
<Location /ha>
    SetHandler api_ha-handler
</Location>
<Location /api/faz>
    SetHandler api_faz-handler
</Location>
<Location /api/fmg>
    SetHandler api_fmg-handler
</Location>
<Location /api/ldap>
    SetHandler api_ldap-handler
</Location>
<Location /api/reports>
    SetHandler api_reports-handler
</Location>
<Location /api/usrbwl>
    SetHandler api_usrbwl-handler
</Location>
<Location /api/usrbwlqry>
    SetHandler api_usrbwlqry-handler
</Location>
<Location "/fabric-authorization">
    SetHandler login-handler
</Location>
<Location "/fabric-logincheck">
    SetHandler logincheck-handler
</Location>
<Location "/fabric-logindisclaimer">
    SetHandler logindisclaimer-handler
</Location>

#
# DocumentRoot: The directory out of which you will serve your
# documents. By default, all requests are taken from this directory, but
# symbolic links and aliases may be used to point to other locations.
#
DocumentRoot "/migadmin"
FileETag None

<Directory "/migadmin">
    RewriteEngine On
    SetHandler fortiweb-static-handler
    # Serve gzip compressed files if they exist and the client accepts gzip.
    RewriteCond %{HTTP:Accept-encoding} gzip
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME}\.gz -s
    RewriteRule ^(.*)\.(css|js|json|html|xml|mib|svg|map)$ $1\.$2\.gz [QSA]
    # Serve correct content types, and prevent mod_deflate double gzip.
    RewriteRule \.gz$ - [E=no-gzip:1]
    RewriteRule \.js\.gz$ - [T=application/javascript]
    RewriteRule \.(css|html)\.gz$ - [T=text/$1]
    RewriteRule \.(json|xml)\.gz$ - [T=application/$1]
    RewriteRule \.mib\.gz$ - [T=text/plain]
    RewriteRule \.svg\.gz$ - [T=image/svg+xml]
</Directory>

Include conf/admin-vhost.conf
</VirtualHost>

# Failsafe: Anything that does not match another VirtualHost is denied
<VirtualHost _default_>
    DocumentRoot "/usr/local/apache2/empty
    RewriteEngine On
    RewriteCond %%{REQUEST_METHOD} (GET) [NC]
    RewriteRule .* - [R=403,L]
    RewriteCond %%{REQUEST_METHOD} !(GET) [NC]
    RewriteRule .* - [R=405,L]
</VirtualHost>

#
# The following lines prevent .htaccess and .htpasswd files from being
# viewed by Web clients.
#
<Files ".ht*">
    #Require all denied
</Files>

#
# ErrorLog: The location of the error log file.
# If you do not specify an ErrorLog directive within a <VirtualHost>
# container, error messages relating to that virtual host will be
# logged here.  If you *do* define an error logfile for a <VirtualHost>
# container, that host's errors will be logged there and not here.
#
ErrorLog "/dev/null"
<IfDefine CONFIG_DEBUG>
ErrorLog "/tmp/httpsd_error_log"
</IfDefine>

#
# LogLevel: Control the number of messages logged to the error_log.
# Possible values include: debug, info, notice, warn, error, crit,
# alert, emerg.
#
LogLevel warn

<IfModule log_config_module>
    #
    # The following directives define some format nicknames for use with
    # a CustomLog directive (see below).
    #
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
    LogFormat "%h %l %u %t \"%r\" %>s %b" common

    <IfModule logio_module>
      # You need to enable mod_logio.c to use %I and %O
      LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %I %O" combinedio
    </IfModule>

    #
    # The location and format of the access logfile (Common Logfile Format).
    # If you do not define any access logfiles within a <VirtualHost>
    # container, they will be logged here.  Contrariwise, if you *do*
    # define per-<VirtualHost> access logfiles, transactions will be
    # logged therein and *not* in this file.
    #
    CustomLog "logs/access_log" common

    #
    # If you prefer a logfile with access, agent, and referer information
    # (Combined Logfile Format) you can use the following directive.
    #
    #CustomLog "logs/access_log" combined
</IfModule>

<IfModule cgid_module>
    #
    # ScriptSock: On threaded servers, designate the path to the UNIX
    # socket used to communicate with the CGI daemon of mod_cgid.
    #
    #Scriptsock cgisock
</IfModule>

<IfModule headers_module>
    #
    # Avoid passing HTTP_PROXY environment to CGI's on this or any proxied
    # backend servers which have lingering "httpoxy" defects.
    # 'Proxy' request header is undefined by the IETF, not listed by IANA
    #
    RequestHeader unset Proxy early
</IfModule>

<IfModule mime_module>
    #
    # TypesConfig points to the file containing the list of mappings from
    # filename extension to MIME-type.
    #
    TypesConfig conf/mime.types

    #
    # AddType allows you to add to or override the MIME configuration
    # file specified in TypesConfig for specific file types.
    #
    #AddType application/gzip .tgz
    #
    # AddEncoding allows you to have certain browsers uncompress
    # information on the fly.
    #
    #AddEncoding compress .Z
    AddEncoding gzip .gz .tgz
    #
    # If the AddEncoding directives above are commented-out, then you
    # probably should define those extensions to indicate media types:
    #
    #AddType application/compress .Z
    AddType application/gzip .gz .tgz

    #
    # AddHandler allows you to map certain file extensions to "handlers":
    # actions unrelated to filetype. These can be either built into the server
    # or added with the Action directive (see below)
    #
    # To use CGI scripts outside of ScriptAliased directories:
    # (You will also need to add "ExecCGI" to the "Options" directive.)
    #
    #AddHandler cgi-script .cgi

    # For type maps (negotiated resources):
    #AddHandler type-map var

    #
    # Filters allow you to process content before it is sent to the client.
    #
    # To parse .shtml files for server-side includes (SSI):
    # (You will also need to add "Includes" to the "Options" directive.)
    #
    #AddType text/html .shtml
    #AddOutputFilter INCLUDES .shtml
</IfModule>

#
# The mod_mime_magic module allows the server to use various hints from the
# contents of the file itself to determine its type.  The MIMEMagicFile
# directive tells the module where the hint definitions are located.
#
#MIMEMagicFile conf/magic

#
# Customizable error responses come in three flavors:
# 1) plain text 2) local redirects 3) external redirects
#
# Some examples:
#ErrorDocument 500 "The server made a boo boo."
#ErrorDocument 404 /missing.html
#ErrorDocument 404 "/cgi-bin/missing_handler.pl"
#ErrorDocument 402 http://www.example.com/subscription_info.html
#
ErrorDocument 500 /error/500
ErrorDocument 404 /error/404
ErrorDocument 403 /error/403
ErrorDocument 401 /error/401

#
# MaxRanges: Maximum number of Ranges in a request before
# returning the entire resource, or one of the special
# values 'default', 'none' or 'unlimited'.
# Default setting is to accept 200 Ranges.
#MaxRanges unlimited

#
# EnableMMAP and EnableSendfile: On systems that support it,
# memory-mapping or the sendfile syscall may be used to deliver
# files.  This usually improves server performance, but must
# be turned off when serving from networked-mounted
# filesystems or if support for these functions is otherwise
# broken on your system.
# Defaults: EnableMMAP On, EnableSendfile Off
#
#EnableMMAP off
#EnableSendfile on

# Supplemental configuration
#
# The configuration files in the conf/extra/ directory can be
# included to add extra features or to modify the default configuration of
# the server, or you may simply copy their contents here and change as
# necessary.

# Server-pool management (MPM specific)
#Include conf/extra/httpd-mpm.conf

# Multi-language error messages
#Include conf/extra/httpd-multilang-errordoc.conf

# Fancy directory listings
#Include conf/extra/httpd-autoindex.conf

# Language settings
#Include conf/extra/httpd-languages.conf

# User home directories
#Include conf/extra/httpd-userdir.conf

# Real-time info on requests and configuration
#Include conf/extra/httpd-info.conf

# Virtual hosts
#Include conf/extra/httpd-vhosts.conf

# Local access to the Apache HTTP Server Manual
#Include conf/extra/httpd-manual.conf

# Distributed authoring and versioning (WebDAV)
#Include conf/extra/httpd-dav.conf

# Various default settings
#Include conf/extra/httpd-default.conf

# Secure (SSL/TLS) connections
#Include conf/extra/httpd-ssl.conf
#
# Note: The following must must be present to support
#       starting without SSL on platforms with no /dev/random equivalent
#       but a statically compiled-in mod_ssl.
#
<IfModule ssl_module>
    SSLRandomSeed startup builtin
    SSLRandomSeed connect builtin
</IfModule>

# Contains VirtualHost and MDomain configuration generated from cmdb
IncludeOptional ${HTTPD_DYNAMIC_CONF}/md-acme.conf

<IfModule reqtimeout_module>
RequestReadTimeout handshake=5 header=10-20,MinRate=500 body=20,MinRate=1000
</IfModule>

# limits the amount of memory that process can consume by (accidental) leakage.
MaxConnectionsPerChild 50
GracefulShutdownTimeout 5

ServerTokens Prod
ServerSignature Off
<IfDefine REQUEST_BODY_LIMIT>
LimitRequestBody ${REQUEST_BODY_LIMIT}
</IfDefine>