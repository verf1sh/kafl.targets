# kAFL config — FortiGate FortiOS 7.4.3 pre-auth httpsd fuzz
# Agent connects to httpsd:9980 (plain HTTP, bypassing wad TLS termination)
qemu_path: $QEMU_ROOT/x86_64-softmmu/qemu-system-x86_64
ptdump_path: $LIBXDC_ROOT/build/ptdump_static

qemu_image: /home/verf1sh/fuzzing/kAFL/kafl/examples/firmware/fortigate/fortios_7.4.3.qcow2
qemu_memory: 4096
seed_dir: /home/verf1sh/fuzzing/kAFL/kafl/examples/firmware/fortigate/seeds

qemu_base: -enable-kvm -machine kAFL64-v1 -cpu kAFL64-Hypervisor-v1,+vmx -no-reboot -display none
qemu_serial: -serial telnet:127.0.0.1:4444,server,nowait
qemu_extra: -netdev tap,id=net0,ifname=tap-fgt,script=no,downscript=no -device e1000,netdev=net0

# FortiOS httpsd is /bin/init multi-call code.  The learner/agent logs show the
# executable text mapping is stable at this range on the 7.4.3 qcow2.
ip0: 0x43f000-0x3073000

afl_dumb_mode: true
kickstart: 0
radamsa: false

custom_mutator: strategy_mutator
strategy_config: /home/verf1sh/fuzzing/kAFL/kafl/examples/firmware/fortigate/strategy.yaml
